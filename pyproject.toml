[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcc2026"
version = "0.1.0"
description = "Arc Virtual Cell Challenge 2026 - zero-shot CRISPRi perturbation response prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "anndata>=0.10",
  "h5py>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = ["cell-eval>=0.8.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
